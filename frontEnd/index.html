<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时数据看板</title>
    <!-- 引入所需库 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.2/dist/echarts.min.js"></script>
</head>
<body>
    <div id="app">
        <div class="dashboard">
            <h1>实时数据监控看板</h1>
            <div class="controls">
                <button @click="toggleUpdates">{{ updateButtonText }}</button>
                更新间隔：
                <input type="number" v-model.number="updateInterval" min="500" step="500">
                ms
            </div>
            <div class="chart-container">
                <div ref="chart" class="chart"></div>
            </div>
        </div>
    </div>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .controls {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            padding: 8px 16px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #66b1ff;
        }

        input {
            padding: 6px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            width: 100px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 600px;
        }

        .chart {
            width: 100%;
            height: 100%;
        }
    </style>

    <script>
        const { createApp, ref, onMounted, onBeforeUnmount, computed } = Vue;

        createApp({
          setup() {
            const chart = ref(null);
            let myChart = null;
            const isUpdating = ref(true);
            const updateInterval = ref(1000);
            let timer = null;
            let stockCode = 1;
            let feature = "original";

            // 模拟数据生成
            // const generateData = () => {
            //     const now = new Date();
            //     return {
            //         time: now.toLocaleTimeString(),
            //         value: Math.random() * 100 + 20 // 生成20-120之间的随机数
            //     };
            // };
            const getData = async (stockCode) => {
              const url = `http://localhost:2425/api/getData/${feature}/${stockCode}`
              try{
                const response = await fetch(url)
                if (!response.ok) throw new Error('网络响应异常');
                const data = (await response.json());
                // const data = { timestamp: "2023-07-25T12:34:56", value: 42.5 }
                // 假设返回的数据格式为：
                // { timestamp: "2023-07-25T12:34:56", value: 42.5 }
                return {
                    // time: [new Date(data.timestamp).toLocaleTimeString()],
                    time: data.date.map((p)=>new Date(p).toLocaleDateString()),
                    value: data.close
                };
              } catch (error) {
                console.error('数据获取失败:', error);
                // 可选：显示错误信息或使用默认值
                return {
                  time: new Date().toLocaleTimeString(),
                  value: 0
                };
              }
            }

            // 初始化图表
            const initChart = () => {
              if (chart.value) {
                myChart = echarts.init(chart.value);
                const option = {
                  title: {
                    text: '实时数据趋势图'
                  },
                  tooltip: {
                    trigger: 'axis',
                    formatter: (params) => {
                      const date = new Date();
                      return `${params[0].axisValue}<br/>${params[0].marker} ${params[0].value}`;
                    }
                  },
                  xAxis: {
                    type: 'category',
                    data: []
                  },
                  yAxis: {
                    type: 'value',
                    min: 0,
                    max: 150
                  },
                  series: [{
                    name: '数据值',
                    type: 'line',
                    smooth: true,
                    data: [],
                    areaStyle: {
                      color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: 'rgba(64, 158, 255, 0.4)' },
                        { offset: 1, color: 'rgba(64, 158, 255, 0.1)' }
                      ])
                    }
                  }],
                  grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                  }
                };
                myChart.setOption(option);
              }
            };

            // 更新图表数据
            const updateChartData = async () => {
              if (!myChart) return;

              // const newData = generateData();
              const stockData = await getData(1);
              const option = myChart.getOption();

              // 保留最近100个数据点
              if (option.xAxis[0].data.length >= 100) {
                option.xAxis[0].data.shift();
                option.series[0].data.shift();
              }

              console.log(stockData)
              option.xAxis[0].data = stockData.time;
              option.series[0].data= stockData.value;

              myChart.setOption(option);
            };

            // 控制更新
            const startUpdates = () => {
              // if (!timer) {
              //   timer = setInterval(updateChartData, updateInterval.value);
              // }
              updateChartData(stockCode)
            };

            const stopUpdates = () => {
              if (timer) {
                clearInterval(timer);
                timer = null;
              }
            };

            const toggleUpdates = () => {
              isUpdating.value = !isUpdating.value;
              if (isUpdating.value) {
                startUpdates();
              } else {
                stopUpdates();
              }
            };

            const dataFeature = computed(() => {
              return feature.value
            });

            // 计算属性
            const updateButtonText = computed(() => {
              return isUpdating.value ? '暂停更新' : '开始更新';
            });

            // 生命周期
            onMounted(() => {
              initChart();
              startUpdates();
            });

            onBeforeUnmount(() => {
              stopUpdates();
              if (myChart) {
                myChart.dispose();
              }
            });

            return {
              chart,
              isUpdating,
              updateInterval,
              updateButtonText,
              toggleUpdates
            };
          }
        }).mount('#app');
    </script>
</body>
</html>
